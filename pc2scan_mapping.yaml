pointcloud_to_laserscan_node:
  ros__parameters:
    target_frame: body
    transform_tolerance: 0.05
    min_height: -0.1      # ~ankle height relative to body frame
    max_height: 0.5       # ~waist height — slices a 2D plane through obstacles
    angle_min: -3.14159
    angle_max:  3.14159
    angle_increment: 0.00314   # ~0.18° resolution
    scan_time: 0.03333         # 30 Hz
    range_min: 0.3
    range_max: 20.0
    use_inf: true
    inf_epsilon: 1.0

